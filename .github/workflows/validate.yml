name: validate
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ./scripts/validate.sh
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag audit-verification-system:ci .
      - run: test "$(docker image inspect audit-verification-system:ci --format '{{.Config.User}}')" = "audit"
