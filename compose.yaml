services:
  audit-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: audit-verification-system:local
    user: "10001:10001"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AUDIT_LEDGER_PATH: /app/backend/audit_repo/audit_log.json
      AUDIT_LOG_LEVEL: INFO
    volumes:
      - ./backend/audit_repo:/app/backend/audit_repo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3); data=json.load(response); raise SystemExit(0 if response.status==200 and data.get('status')=='ready' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
