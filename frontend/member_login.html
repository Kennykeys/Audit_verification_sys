<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-shell">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="card auth-card">
    <h1>Member Login</h1>
    <form id="loginForm">
      <label for="memberId">Member ID</label>
      <input type="text" id="memberId" name="member_id" placeholder="Example: M001" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <pre id="loginResponse" class="status-panel" role="alert" aria-live="assertive" aria-atomic="true"></pre>
  </main>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="member_login.js"></script>
</body>
</html>
