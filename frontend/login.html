<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-shell">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="card auth-card">
    <h1>Admin Login</h1>
    <form id="loginForm">
      <label for="username">Administrator username</label>
      <input type="text" id="username" name="username" placeholder="Enter administrator username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <pre id="loginResponse" class="status-panel" role="alert" aria-live="assertive" aria-atomic="true"></pre>
    <button onclick="goHome()">Home</button>
  </main>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="login.js"></script>
  <script>
    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
